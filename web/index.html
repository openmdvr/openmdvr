<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it env(safe-area-inset-*) always resolves
         to 0 on iOS. Needed by the mobile header/tab bar (Layout.tsx,
         BottomTabBar.tsx) and DriverHome.tsx so they clear the notch and
         home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OpenMDVR</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Apply the theme before first paint (no flash): same resolution as
         src/lib/theme.ts (saved preference or prefers-color-scheme). -->
    <script>
      (function () {
        var t = "system";
        try { t = localStorage.getItem("omd-theme") || "system"; } catch (e) {}
        if (t === "system") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
