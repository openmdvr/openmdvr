name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (device servers & video bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jt808-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: jt808-server/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && govulncheck ./...

  api:
    name: API + RLS isolation (Postgres/TimescaleDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start database and apply migrations
        run: |
          bash infra/init-env.sh
          docker compose -f infra/docker-compose.yml up -d postgres
          docker compose -f infra/docker-compose.yml run --rm migrate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt -r infra/postgres/tests/requirements.txt pytest-asyncio
      - name: RLS isolation tests
        run: pytest -q infra/postgres/tests
      - name: API tests
        working-directory: api
        run: pytest -q

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vite build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
